<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The AQ</title>

    <!-- Google Search Description & Site Name SEO -->
    <meta name="description" content="This is a website that is built by a student.">
    <meta property="og:site_name" content="The AQ">
    <meta property="og:title" content="The AQ">
    <meta property="og:description" content="This is a website that is built by a student.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://asjadqamar.github.io/the-aq-website/">
    <meta property="og:image" content="https://asjadqamar.github.io/the-aq-website/logo.png">

    <!-- Website Logo (Favicon for Browser & Google Search) -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://asjadqamar.github.io/the-aq-website/logo.png">
    <link rel="apple-touch-icon" href="https://asjadqamar.github.io/the-aq-website/logo.png">

    <!-- Google Official Site Name Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The AQ",
      "url": "https://asjadqamar.github.io/the-aq-website/"
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #16213e 100%);
            color: #ffffff;
            overflow-x: hidden;
        }

        /* ================= PAGE 1 (HOME) ================= */
        #home-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Welcome Banner - Upar, Left aur Right side thodi jagah ke sath */
        .welcome-banner {
            width: calc(100% - 24px);
            max-width: 656px;
            margin: 16px auto 0 auto;
            padding: 15px 12px;
            border-radius: 14px;
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 50%, #6a11cb 100%);
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        .welcome-banner h1 {
            margin: 0;
            font-size: clamp(1.1rem, 4.8vw, 2.4rem);
            font-weight: 700;
            letter-spacing: 2px;
            white-space: nowrap;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Dono Boxes ka Container */
        .boxes-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            gap: 12px;
            width: 100%;
            max-width: 680px;
            margin-top: 20px;
            padding: 0 12px;
        }

        .card {
            flex: 1;
            border-radius: 14px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-app {
            background: linear-gradient(145deg, rgba(255, 152, 0, 0.16), rgba(255, 87, 34, 0.1));
            border: 1px solid rgba(255, 167, 38, 0.45);
        }

        .card-soon {
            background: linear-gradient(145deg, rgba(0, 210, 255, 0.16), rgba(138, 43, 226, 0.14));
            border: 1px solid rgba(0, 210, 255, 0.45);
            cursor: pointer;
        }

        .card-soon:active {
            transform: scale(0.97);
        }

        .card h2 {
            margin: 0 0 10px 0;
            font-size: clamp(0.8rem, 2.8vw, 1.15rem);
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f1f5f9;
        }

        .btn {
            display: inline-block;
            padding: 9px 12px;
            border-radius: 25px;
            font-size: clamp(0.65rem, 2.3vw, 0.92rem);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.4px;
            line-height: 1.25;
            transition: 0.25s ease;
        }

        .btn-download {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 111, 0, 0.4);
        }

        .btn-download:hover {
            box-shadow: 0 0 18px rgba(255, 152, 0, 0.75);
        }

        .btn-soon {
            background: linear-gradient(90deg, #00c6ff, #8e2de2);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 198, 255, 0.35);
        }

        /* ================= PAGE 2 (TARGET & CONTACT) ================= */
        #info-page {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #140f2d 0%, #241744 50%, #0f2027 100%);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .target-banner {
            width: 100%;
            margin: 0;
            padding: 15px 10px;
            background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 35%, #8e2de2 70%, #00c6ff 100%);
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        .target-banner h1 {
            margin: 0;
            font-size: clamp(1.02rem, 4.3vw, 2.35rem);
            font-weight: 700;
            white-space: nowrap;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .info-card {
            width: calc(100% - 24px);
            max-width: 560px;
            margin-top: 32px;
            padding: 26px 18px;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .help-label {
            margin: 0 0 10px 0;
            font-size: clamp(1rem, 3.8vw, 1.4rem);
            font-weight: 600;
            color: #00e5ff;
        }

        .phone-link {
            display: inline-block;
            margin-bottom: 22px;
            padding: 10px 22px;
            border-radius: 30px;
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: #0b132b;
            font-size: clamp(1rem, 3.8vw, 1.35rem);
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            transition: transform 0.2s ease;
        }

        .phone-link:hover {
            transform: scale(1.04);
        }

        .divider {
            height: 1px;
            width: 80%;
            margin: 0 auto 20px auto;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        }

        .italic-text {
            margin: 0 0 26px 0;
            font-style: italic;
            font-size: clamp(0.95rem, 3.5vw, 1.3rem);
            font-weight: 500;
            background: linear-gradient(90deg, #ffd200, #ff758c, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Mobile ke liye compact spacing */
        @media (max-width: 500px) {
            .welcome-banner {
                width: calc(100% - 16px);
                margin: 12px auto 0 auto;
                padding: 13px 10px;
                border-radius: 12px;
            }
            .boxes-container {
                gap: 8px;
                margin-top: 14px;
                padding: 0 8px;
            }
            .card {
                padding: 13px 6px;
                border-radius: 12px;
            }
            .btn {
                padding: 7px 9px;
            }
        }
    </style>
</head>
<body>

    <!-- PAGE 1: HOME -->
    <div id="home-page">
        <div class="welcome-banner">
            <h1>WELCOME TO THE AQ</h1>
        </div>

        <div class="boxes-container">
            <div class="card card-app">
                <h2>The AQ App</h2>
                <a href="TheAQ.apk" download class="btn btn-download">DOWNLOAD THE AQ APP</a>
            </div>

            <div class="card card-soon" onclick="openInfoPage()">
                <h2>Coming Soon</h2>
                <span class="btn btn-soon">OPEN PAGE</span>
            </div>
        </div>
    </div>

    <!-- PAGE 2: TARGET & CONTACT -->
    <div id="info-page">
        <div class="target-banner">
            <h1>Our Target is Your Happiness</h1>
        </div>

        <div class="info-card">
            <p class="help-label">For Help Contact Us</p>
            <a href="tel:+919973571833" class="phone-link">+91 9973571833</a>

            <div class="divider"></div>

            <p class="italic-text">For Making App or Website Contact Us</p>

            <button class="back-btn" onclick="goHome()">← Back</button>
        </div>
    </div>

    <script>
        function openInfoPage() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('info-page').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function goHome() {
            document.getElementById('info-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'flex';
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
