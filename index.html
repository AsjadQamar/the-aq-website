<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The AQ</title>
    
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #141e30 0%, #243b55 100%); /* Premium Dark Blue Theme */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            gap: 25px; /* Box ke beech ka gap */
            box-sizing: border-box;
        }

        /* Pehla Box - Sleek aur Patla */
        .card-welcome {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 3.5rem); /* Screen ke hisab se automatic perfect size */
            margin: 0;
            letter-spacing: 2px;
            white-space: nowrap;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Niche wale dono box ka container (Hamesha ek line mein) */
        .bottom-boxes {
            display: flex;
            flex-direction: row; /* Mobile par bhi box ek hi line mein rahenge */
            gap: 12px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
            box-sizing: border-box;
        }

        .small-card {
            flex: 1; /* Dono box ko barabar jagah */
            padding: 20px 10px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* App Box */
        .card-app {
            background: rgba(255, 152, 0, 0.08);
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        /* Coming Soon Box */
        .card-soon {
            background: rgba(0, 198, 255, 0.08);
            border: 1px solid rgba(0, 198, 255, 0.3);
        }

        h2 {
            font-size: clamp(0.9rem, 3vw, 1.4rem); /* Text bahar na nikle isliye fit size */
            margin: 0 0 12px 0;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Button Style */
        .btn {
            padding: 8px 12px;
            font-size: clamp(0.75rem, 2.5vw, 1.1rem);
            font-weight: bold;
            border-radius: 25px;
            text-decoration: none;
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .download-btn {
            background-color: #ff9800;
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .download-btn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 20px #ff9800;
        }

        .soon-btn {
            background-color: transparent;
            color: #00c6ff;
            border: 1.5px dashed #00c6ff;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- Box 1: Welcome -->
    <div class="card-welcome">
        <h1>WELCOME TO THE AQ</h1>
    </div>

    <!-- Box 2 & 3: Ek hi line mein -->
    <div class="bottom-boxes">
        
        <div class="small-card card-app">
            <h2>Download App</h2>
            <a href="TheAQ.apk" download class="btn download-btn">Download APK</a>
        </div>

        <div class="small-card card-soon">
            <h2>New Feature</h2>
            <div class="btn soon-btn">Coming Soon</div>
        </div>

    </div>

</body>
</html>
